<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClockedIn - Einstellungen</title>
    <link rel="stylesheet" href="https://use.typekit.net/kxt6usx.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">

        <header class="main-header">
            <img src="svgs/logo.svg" class="logo" alt="ClockedIn Logo">
            <span class="location-tag">Standort Chur</span>
        </header>

        <h1 class="settings-headline">Settings</h1>

<div class="profile-card">
    <div class="avatar" id="avatar">
        <img src="svgs/uhrklein.svg" alt="Profilbild">
    </div>

    <div class="profile-info">
        <p class="profile-name" id="profile-name-display">…</p>
        <span class="entry-tag buero">Büro</span>
    </div>
</div>

        <div class="settings-form">
            <label class="settings-label">Vorname</label>
            <div class="input-container">
                <input type="text" id="firstname" placeholder="Vorname" value="">
            </div>

            <label class="settings-label">Nachname</label>
            <div class="input-container">
                <input type="text" id="lastname" placeholder="Nachname" value="">
            </div>

            <label class="settings-label">E-Mail</label>
            <div class="input-container">
                <input type="email" id="email" placeholder="E-Mail" value="">
            </div>
        </div>

        <button class="big-beautiful-button" id="save-btn">Speichern</button>

        <!-- Easter Egg -->
        <div class="easter-overlay" id="easter-overlay">
            <div class="easter-card">
                <div class="easter-anim" id="easter-anim">🕐</div>
                <h2>Geheimmodus!</h2>
                <p id="easter-text">Du hast zu viel Zeit. Zur Strafe musst du jetzt 10 Sekunden warten.</p>
                <div class="easter-countdown" id="easter-countdown">10</div>
                <button class="big-beautiful-button" id="easter-close" disabled>Ich akzeptiere mein Schicksal</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <img src="svgs/Nav Icons/Home_Icon_Default.svg" class="nav-icon" alt="">
                Home
            </a>
            <a href="stundenuebersicht.html" class="nav-item">
                <img src="svgs/Nav Icons/Uebersicht_Icon_Default.svg" class="nav-icon" alt="">
                Übersicht
            </a>
            <a href="settings.html" class="nav-item active">
                <img src="svgs/Nav Icons/Einstellungen_Icon_Active.svg" class="nav-icon" alt="">
                Einstellungen
            </a>
        </nav>

    </div>

    <script src="js/api-config.js"></script>
    <script src="js/format.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
