<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClockedIn - Übersicht</title>
    <link rel="stylesheet" href="https://use.typekit.net/kxt6usx.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">

        <div class="main-header">
            <img src="svgs/logo.svg" class="logo" alt="ClockedIn Logo">
            <span class="location-tag">Standort Chur</span>
        </div>

        <div class="welcome-section">
            <h1>Time<br> sheet</h1>
        </div>
        <div>
            <p>Überblick über deine Stunden in der Kita.</p>
        </div>

        <div class="tab-group">
            <button type="button" class="tab-btn" data-view="day">Tag</button>
            <button type="button" class="tab-btn active" data-view="week">Woche</button>
            <button type="button" class="tab-btn" data-view="month">Monat</button>
        </div>

        <div class="week-nav">
            <button type="button" class="week-arrow" id="period-prev">&lt;</button>
            <span id="period-label"><img src="svgs/calendar_today.svg" class="week-icon" alt=""> …</span>
            <button type="button" class="week-arrow" id="period-next">&gt;</button>
        </div>

        <p class="period-total" id="period-total"></p>

        <div class="entry-list" id="entry-list"></div>

        <button type="button" class="big-beautiful-button">Exportieren</button>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <img src="svgs/Nav Icons/Home_Icon_Default.svg" class="nav-icon" alt="">
                Home
            </a>
            <a href="stundenuebersicht.html" class="nav-item active">
                <img src="svgs/Nav Icons/Uebersicht_Icon_Active.svg" class="nav-icon" alt="">
                Übersicht
            </a>
            <a href="settings.html" class="nav-item">
                <img src="svgs/Nav Icons/Einstellungen_Icon_Default.svg" class="nav-icon" alt="">
                Einstellungen
            </a>
        </nav>

    </div>

    <script src="js/api-config.js"></script>
    <script src="js/format.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/overview.js"></script>
</body>

</html>
